name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The log sources live in other repos, so a push here isn't the only thing
  # that changes the site. Rebuild daily to pick those up.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          # 0.22+ required: config.toml uses the giallo [markdown.highlighting]
          # table, which older releases reject outright. Keep in step with the
          # zola in flake.nix.
          ZOLA_VERSION=0.22.1
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv zola /usr/local/bin/

      - name: Install WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
          pipx install weasyprint

      # bin/build-logs parses config.toml with tomllib, which is 3.11+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build Svelte
        run: |
          cd svelte
          pnpm install --frozen-lockfile
          pnpm build

      # There are no sibling checkouts here, so sources are pulled from their
      # repos. A source giving only `path` has nothing to fall back to and is
      # warned about, not fatal.
      - name: Pull logs
        run: bin/build-logs --prefer repo
        env:
          GITHUB_TOKEN: ${{ secrets.LOG_SOURCES_TOKEN || secrets.GITHUB_TOKEN }}

      # Generated pages never enter content/, so zola builds from a staging
      # root that symlinks the real tree plus .build/logs.
      - name: Stage build root
        run: bin/stage-site

      # Mirrors `just pdf`: the first build produces the print page and its
      # stylesheet, weasyprint turns them into static/resume.pdf, and the final
      # build below picks that up as a static asset.
      - name: Render résumé PDF
        run: |
          zola --root .build/site build --output-dir public --force
          weasyprint -s public/resume-print.css public/about/resume/print/index.html static/resume.pdf

      - name: Build site
        run: zola --root .build/site build --output-dir public --force

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
