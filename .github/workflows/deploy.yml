name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Log sources live in other repos, so a push here isn't the only thing that
  # changes the site. Rebuild nightly to pick those up.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build through the flake rather than installing zola, node, pnpm and
      # weasyprint separately. Pinning them twice is how CI ends up on a
      # different pnpm than the one the lockfile and pnpm-workspace.yaml were
      # written for. flake.nix is the single source of truth.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # `just build` is exactly what runs locally: svelte -> logs -> stage ->
      # résumé PDF -> zola. LOGS_PREFER=repo because there are no sibling
      # checkouts here, so sources are pulled from their repos.
      - name: Build site
        run: nix develop -c just build
        env:
          LOGS_PREFER: repo
          GITHUB_TOKEN: ${{ secrets.LOG_SOURCES_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # External links rot for reasons outside this repo (a wiki reorganises, a host
  # starts 403ing crawlers), and most of them live in log content pulled from
  # other repos. Report them without letting them block a deploy.
  links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check links
        run: nix develop -c just check
        env:
          LOGS_PREFER: repo
          GITHUB_TOKEN: ${{ secrets.LOG_SOURCES_TOKEN || secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
